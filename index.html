<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff7fb">
<title>Une petite question pour Noa ❤️</title>
<style>
*{box-sizing:border-box} :root{--bg1:#fff7fb;--bg2:#fde8f1;--text:#321f28;--muted:#7d6570;--accent:#e84d78;--card:rgba(255,255,255,.84)}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.95) 0 7%,transparent 22%),radial-gradient(circle at 85% 10%,rgba(255,178,201,.28),transparent 30%),linear-gradient(145deg,var(--bg1),var(--bg2));overflow:hidden}
.wrap{width:min(680px,100%)} .card{background:var(--card);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:32px;padding:42px 28px 30px;box-shadow:0 24px 80px rgba(145,54,83,.18);text-align:center}
.heart{width:90px;height:90px;margin:0 auto 22px;display:grid;place-items:center;border-radius:28px;background:linear-gradient(135deg,#ffd9e5,#fff);box-shadow:0 14px 35px rgba(232,77,120,.18);font-size:48px;animation:pulse 1.8s ease-in-out infinite}
h1{font-size:clamp(30px,6vw,48px);line-height:1.02;margin:0 0 14px;letter-spacing:-1.5px}.sub{font-size:17px;line-height:1.55;color:var(--muted);margin:0 auto 28px;max-width:520px}.question{min-height:80px;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,4vw,30px);font-weight:750;line-height:1.25;margin-bottom:20px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}button{appearance:none;border:0;border-radius:16px;padding:15px 23px;font-size:17px;font-weight:750;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease;font-family:inherit}button:hover{transform:translateY(-2px)}button:active{transform:scale(.98)}
.yes{color:#fff;background:linear-gradient(135deg,var(--accent),#cf315f);box-shadow:0 14px 24px rgba(232,77,120,.28)}.no{background:#fff;color:#68434f;border:1px solid #efd8e0;box-shadow:0 8px 18px rgba(60,24,38,.06)}
.success{display:none}.success h2{font-size:38px;line-height:1.05;margin:0 0 12px}.success p{font-size:18px;line-height:1.55;color:var(--muted);margin:0 auto;max-width:520px}.tiny{margin-top:18px;font-size:13px;color:#a0848e}
.hearts span{position:fixed;left:var(--x);top:105vh;font-size:var(--s);animation:floatUp var(--d) linear forwards;pointer-events:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}@keyframes floatUp{to{transform:translateY(-120vh) rotate(24deg);opacity:0}}
@media(max-width:520px){body{padding:14px}.card{padding:30px 18px 24px;border-radius:26px}.actions{flex-direction:column}.actions button{width:100%}.heart{width:78px;height:78px;font-size:40px}}
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<div class="wrap"><main class="card">
<section id="ask">
<div class="heart">❤️</div>
<h1>Noa, j’ai une petite question…</h1>
<p class="sub">Promis, pas besoin de réfléchir pendant trois heures 😌</p>
<div class="question" id="question">Ça te dit qu’on aille manger ensemble ? 🍝</div>
<div class="actions"><button class="yes" id="yesBtn">Oui ❤️</button><button class="no" id="noBtn">Non 🙈</button></div>
</section>
<section class="success" id="success">
<div class="heart">🥹</div><h2>YESSSS ❤️</h2>
<p>Je savais que tu avais bon goût 😌<br>Alors… on mange où ? 🍝✨</p>
<div class="tiny">Tu peux considérer ça comme une réservation morale. 😏</div>
</section>
</main></div>
<script>
const API_URL="https://invitation-nw.vercel.app/api/response";
const messages=[
"Tu es sûre ? 🥺 Même Ayko veut voir son père… ❤️",
"Vraiment sûre ? Ayko commence à se demander pourquoi tu refuses 😭",
"Tu vas quand même pas empêcher Ayko de revoir son père ? 🥹",
"Allez Noa… même Ayko voterait pour un petit resto 🍝",
"Je crois qu’Ayko serait déçu de cette décision 😭",
"Un dîner tous les deux… et Ayko serait content de revoir son père 😌",
"Promis, je choisis un endroit sympa. Ayko valide déjà 😇",
"Tu peux encore changer d’avis… pour toi, pour moi, pour Ayko 🥺",
"Tu veux vraiment que je dise à Ayko que tu as refusé ? 😭",
"Même pas un petit repas pour faire plaisir à Ayko ? 🐱❤️",
"Je commence à croire que tu fais exprès… Ayko aussi 😂",
"Allez Noa, sois sympa… Ayko attend son moment avec son père 😌",
"Un petit “oui” et tout le monde est content ❤️",
"Tu es coriace… même Ayko n’aurait pas tenu aussi longtemps 😂",
"Je peux encore négocier ? Ayko m’a dit de ne pas abandonner 🥹",
"Deal : tu choisis le restaurant. Ayko choisit le dessert 😏",
"Là, tu rends ça vraiment difficile… je vais devoir appeler Ayko 😭",
"Bon… dernière tentative… enfin, peut-être 😳",
"Je lâche pas l’affaire tout de suite. Ayko non plus 😌",
"Allez… juste un dîner ? Même Ayko veut revoir son père ❤️"
];
let noCount=0;
const ask=document.getElementById("ask"),success=document.getElementById("success"),question=document.getElementById("question"),yesBtn=document.getElementById("yesBtn"),noBtn=document.getElementById("noBtn");

function burst(count=12){
  const wrap=document.getElementById("hearts");
  for(let i=0;i<count;i++){
    const s=document.createElement("span");
    s.textContent=["❤️","💗","💕","✨"][Math.floor(Math.random()*4)];
    s.style.setProperty("--x",Math.random()*100+"vw");
    s.style.setProperty("--s",(16+Math.random()*26)+"px");
    s.style.setProperty("--d",(2.2+Math.random()*2.2)+"s");
    wrap.appendChild(s);
    setTimeout(()=>s.remove(),5000);
  }
}

async function sendResponse(response){
  try{
    const r=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({response,timestamp:new Date().toISOString()})
    });
    if(!r.ok) console.warn("Notification non envoyée:",r.status);
  }catch(e){
    console.warn("Notification non envoyée:",e);
  }
}

yesBtn.addEventListener("click",()=>{
  ask.style.display="none";
  success.style.display="block";
  burst(28);
  sendResponse("Oui");
});

noBtn.addEventListener("click",()=>{
  noCount++;
  question.textContent=messages[(noCount-1)%messages.length];
  if(noCount%7===0) question.animate([{transform:"scale(1)"},{transform:"scale(1.05)"},{transform:"scale(1)"}],{duration:450});
  noBtn.style.transform="scale("+Math.max(.84,1-(noCount%12)*.012)+")";
  yesBtn.style.transform="scale("+Math.min(1.13,1+(noCount%12)*.007)+")";

  // Le NON final est enregistré exactement au 20e clic.
  if(noCount===20){
    sendResponse("Non");
    noBtn.disabled=true;
    noBtn.textContent="Non enregistré 🙈";
  }
});
</script>
</body>
</html>
